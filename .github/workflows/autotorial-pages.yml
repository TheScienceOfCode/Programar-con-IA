name: Publish Autotorial to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lib/autotorial/package-lock.json
      - run: npm ci --prefix lib/autotorial
      - run: npm run build --prefix lib/autotorial
      - name: Install the verified Spanish Piper voice
        run: |
          python3 -m venv "$RUNNER_TEMP/autotorial-piper"
          "$RUNNER_TEMP/autotorial-piper/bin/python" -m pip install 'piper-tts==1.8.0'
          mkdir -p "$RUNNER_TEMP/autotorial-piper/voices"
          "$RUNNER_TEMP/autotorial-piper/bin/python" -m piper.download_voices \
            --download-dir "$RUNNER_TEMP/autotorial-piper/voices" \
            es_MX-claude-high
      - name: Produce every lesson with Spanish narration
        env:
          PIPER_BIN: ${{ runner.temp }}/autotorial-piper/bin/piper
          PIPER_MODEL: ${{ runner.temp }}/autotorial-piper/voices/es_MX-claude-high.onnx
        run: |
          for lesson in lessons/*/INDEX.md; do
            slug="$(basename "$(dirname "$lesson")")"
            node lib/autotorial/dist/cli.js produce "$slug" --host "$GITHUB_WORKSPACE" --voice piper
          done
      - name: Render every lesson to MP4
        run: |
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          for lesson in lessons/*/INDEX.md; do
            slug="$(basename "$(dirname "$lesson")")"
            REMOTION_BROWSER_EXECUTABLE="$browser" node lib/autotorial/dist/cli.js render "$slug" --host "$GITHUB_WORKSPACE" --format mp4
          done
      - run: node lib/autotorial/dist/cli.js publish --host "$GITHUB_WORKSPACE" --base "./"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: bin/autotorial/site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
